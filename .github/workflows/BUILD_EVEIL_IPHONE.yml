name: Build EVEIL Web iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Decompresser le projet de Claude
        run: |
          test -f eveil_v0.3.2.zip
          unzip -q -o eveil_v0.3.2.zip
          test -f eveil/project.godot

      - name: Installer Godot 4.3 et les modeles Web
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          use-dotnet: false
          include-templates: true

      - name: Verifier Godot
        run: godot --version

      - name: Tester le jeu
        working-directory: eveil
        run: sh tools/run_tests.sh

      - name: Compiler la version Web
        working-directory: eveil
        run: sh tools/export_web.sh

      - name: Verifier le ZIP jouable
        working-directory: eveil
        run: |
          test -s build/eveil_web_itch.zip
          for f in index.html index.js index.wasm index.pck; do
            unzip -Z1 build/eveil_web_itch.zip | grep -Fxq "$f" || exit 1
          done

      - name: Publier le ZIP Web (si valide)
        uses: actions/upload-artifact@v4
        with:
          name: eveil-web-itch
          path: eveil/build/eveil_web_itch.zip
          if-no-files-found: error

      - name: Conserver les journaux, meme en cas d'echec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eveil-journaux-godot
          path: eveil/build/logs/
          if-no-files-found: warn
