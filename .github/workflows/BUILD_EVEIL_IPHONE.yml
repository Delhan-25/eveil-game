name: Build EVEIL v0.3.4 iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Decompresser EVEIL v0.3.4
        run: |
          test -f eveil_v0.3.4.zip
          unzip -q -o eveil_v0.3.4.zip
          test -f eveil/project.godot

      - name: Installer Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          use-dotnet: false
          include-templates: true

      - name: Tester EVEIL
        id: tests
        continue-on-error: true
        working-directory: eveil
        run: sh tools/run_tests.sh

      - name: Compiler la preview Web
        working-directory: eveil
        env:
          EXPORT_ALLOW_LOG_ERRORS: '1'
        run: sh tools/export_web.sh

      - name: Verifier les fichiers Web
        working-directory: eveil
        run: |
          test -s build/eveil_web_itch.zip
          for f in index.html index.js index.wasm index.pck; do
            unzip -Z1 build/eveil_web_itch.zip | grep -Fxq "$f" || exit 1
          done

      - name: Fournir la preview NON VALIDEE
        uses: actions/upload-artifact@v4
        with:
          name: EVEIL-v034-PREVIEW-NON-VALIDEE
          path: eveil/build/eveil_web_itch.zip
          retention-days: 7

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVEIL-v034-LOGS
          path: eveil/build/logs/
          if-no-files-found: warn

      - name: Signaler les tests echoues
        if: steps.tests.outcome == 'failure'
        run: |
          echo 'Preview non validee : tests en echec'
          exit 1
